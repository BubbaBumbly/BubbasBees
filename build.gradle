plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

// Release version: <mod>+<game>-<loader>. Also in neoforge.mods.toml.
version = '2.0.0'
ext.releaseTag = "${version}+1.21.1-neoforge"
group = 'com.bubba.bubbasbees'
base.archivesName = 'bubbasbees'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    mavenLocal()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

neoForge {
    version = project.neo_version

    // The access transformer is at the default path (META-INF/accesstransformer.cfg); no wiring needed.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bubbasbees'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bubbasbees'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'bubbasbees'
        }
        data {
            data()
            programArguments.addAll '--mod', 'bubbasbees', '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        bubbasbees {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // GeckoLib is compiled against and bundled into the release jar with a version range.
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    jarJar("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}") {
        version {
            strictly "[${geckolib_version},)"
        }
    }

    // Jade (NeoForge 1.21.1), compile only: the hive panel merges into Jade's tooltip when Jade is installed.
    compileOnly "maven.modrinth:jade:${jade_version}"
    // JEI (NeoForge 1.21.1) API, compile only: info pages and the mixed-planks hive recipe when JEI is installed.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    // MixinExtras: annotations at compile time and bundled into the release jar at runtime.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-neoforge:${mixinextras_version}")) {
        version {
            strictly "[${mixinextras_version},)"
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_version            : mod_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

def jarManifest = [
        "Specification-Title"     : "bubbasbees",
        "Specification-Vendor"    : "Bubba Bumbly",
        "Specification-Version"   : project.version,
        "Implementation-Title"    : "bubbasbees",
        "Implementation-Version"  : mod_version,
        "Implementation-Vendor"   : "Bubba Bumbly",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
]

// The full release jar: the mod plus the bundled GeckoLib and MixinExtras jars (META-INF/jarjar).
// ModDevGradle's JarJar plugin feeds the embedded-jar layout into the main `jar` task, so `jar` is the bundled jar.
tasks.named('jar', Jar).configure {
    archiveFileName = "BubbasBees-${releaseTag}.jar"

    // GPLv3 text ships inside the jar
    from('LICENSE') { rename { 'LICENSE_bubbasbees' } }
    from('LICENSE-ASSETS') { rename { 'LICENSE-ASSETS_bubbasbees' } }

    manifest {
        attributes(jarManifest)
    }
}

// The plain mod jar: everything the bundled jar has except META-INF/jarjar.
tasks.register('nogeckoJar', Jar) {
    group = 'build'
    description = 'The plain mod jar without bundled libraries'
    archiveFileName = "BubbasBees-${releaseTag}-nogecko.jar"
    from sourceSets.main.output

    from('LICENSE') { rename { 'LICENSE_bubbasbees' } }
    from('LICENSE-ASSETS') { rename { 'LICENSE-ASSETS_bubbasbees' } }

    manifest {
        attributes(jarManifest)
    }
}

tasks.named('assemble').configure {
    dependsOn 'jar', 'jarJar', 'nogeckoJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
