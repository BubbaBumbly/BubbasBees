plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
    id 'idea'
    id 'eclipse'
}

// Release version: <mod>+<game>-<loader>. Also in fabric.mod.json.
version = project.mod_version
ext.releaseTag = "${version}+${minecraft_version}-fabric"
group = project.mod_group_id
base.archivesName = 'bubbasbees'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

loom {
    accessWidenerPath = file('src/main/resources/bubbasbees.accesswidener')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    mavenLocal()
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex 'software\\.bernie.*'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // GeckoLib is compiled against and nested into the release jar with a version range.
    modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
    include "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

    // Jade (Fabric 1.21.1), compile only: the hive panel merges into Jade's tooltip when Jade is installed.
    modCompileOnly "maven.modrinth:jade:${project.jade_version}"
    // JEI 1.21.1 common API, compile only: info pages and the mixed-planks hive recipe when JEI is installed.
    // DEVIATION: the Fabric JEI API jar is built with a newer Loom than this build can run; the common API uses the same Mojang names.
    compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"

    // MixinExtras annotations at compile time; the runtime is provided by Fabric Loader 0.15+.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_version: project.mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['fabric.mod.json']) {
        expand replaceProperties
    }
}

def jarManifest = [
        "Specification-Title"     : "bubbasbees",
        "Specification-Vendor"    : "Bubba Bumbly",
        "Specification-Version"   : project.version,
        "Implementation-Title"    : "bubbasbees",
        "Implementation-Version"  : project.mod_version,
        "Implementation-Vendor"   : "Bubba Bumbly",
        "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
]

// The full release jar: the mod plus the bundled GeckoLib (META-INF/jars), via Loom's `include`.
tasks.named('remapJar', net.fabricmc.loom.task.RemapJarTask).configure {
    archiveFileName = "BubbasBees-${releaseTag}.jar"

    manifest {
        attributes(jarManifest)
    }
}

// The plain mod jar: the same mod without the nested GeckoLib jar.
tasks.register('nogeckoJar', net.fabricmc.loom.task.RemapJarTask) {
    group = 'build'
    description = 'The plain mod jar without bundled libraries'
    archiveFileName = "BubbasBees-${releaseTag}-nogecko.jar"
    inputFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    addNestedDependencies = false

    manifest {
        attributes(jarManifest)
    }
}

// The intermediate dev jar; the licence texts ride along into both remapped jars.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'dev'
    from('LICENSE') { rename { 'LICENSE_bubbasbees' } }
    from('LICENSE-ASSETS') { rename { 'LICENSE-ASSETS_bubbasbees' } }
    manifest {
        attributes(jarManifest)
    }
}

tasks.named('assemble').configure {
    dependsOn 'remapJar', 'nogeckoJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
