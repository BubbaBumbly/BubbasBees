    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.bubbasbees]]
    modId="geckolib"
    type="required"
    versionRange="[4.9.2,)"
    ordering="AFTER"
    side="BOTH"
